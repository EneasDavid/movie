<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Assistindo — MOVIE</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:," />
</head>
<body class="player-body">
  <div id="player" class="player" tabindex="-1">
    <video id="video" class="video" playsinline preload="metadata"></video>

    <div id="center-spinner" class="center-spinner" hidden aria-hidden="true">
      <div class="spinner"></div>
    </div>

    <div id="center-feedback" class="center-feedback" aria-hidden="true"></div>

    <div id="error-overlay" class="error-overlay" hidden role="alert">
      <p id="error-message"></p>
      <a class="btn btn-primary" href="/">Voltar ao catálogo</a>
    </div>

    <div id="controls" class="controls">
      <div class="controls-top">
        <a class="icon-btn back-btn" href="/" aria-label="Voltar ao catálogo">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
        </a>
        <h1 id="video-title" class="video-title"></h1>
      </div>

      <div class="controls-bottom">
        <div class="progress-wrap">
          <div id="progress-bar" class="progress-bar" role="slider" tabindex="0"
               aria-label="Progresso do vídeo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progress-buffered" class="progress-buffered"></div>
            <div id="progress-played" class="progress-played"></div>
            <div id="progress-handle" class="progress-handle"></div>
          </div>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <button id="btn-play" class="icon-btn" type="button" aria-label="Reproduzir">
              <svg class="icon-play" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" width="26" height="26" hidden><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>

            <button id="btn-back15" class="icon-btn" type="button" aria-label="Voltar 15 segundos">
              <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3z"/></svg>
              <span class="icon-badge">15</span>
            </button>

            <button id="btn-fwd15" class="icon-btn" type="button" aria-label="Avançar 15 segundos">
              <svg viewBox="0 0 24 24" width="24" height="24" style="transform:scaleX(-1)"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3z"/></svg>
              <span class="icon-badge">15</span>
            </button>

            <div class="volume-group">
              <button id="btn-mute" class="icon-btn" type="button" aria-label="Mudo">
                <svg class="icon-vol-on" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
                <svg class="icon-vol-off" viewBox="0 0 24 24" width="24" height="24" hidden><path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.42.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.9 8.9 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4l-1.88 1.88L12 7.76V4z"/></svg>
              </button>
              <input id="volume" class="volume-slider" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
            </div>

            <div class="time-display">
              <span id="time-current">0:00</span>
              <span class="time-sep">/</span>
              <span id="time-duration">0:00</span>
            </div>
          </div>

          <div class="controls-right">
            <button id="btn-fullscreen" class="icon-btn" type="button" aria-label="Tela cheia">
              <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/player.js" defer></script>
</body>
</html>
